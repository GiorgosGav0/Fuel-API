<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FuelGR</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <div class="col-3 sidebar">

      <h3 class="mb-3">⛽ FuelGR</h3>

      <div class="card p-2 mb-3">
        <h5>Login</h5>
        <input id="username" class="form-control mb-2" placeholder="username">
        <input id="password" class="form-control mb-2" placeholder="password">
        <button class="btn btn-primary w-100" onclick="login()">Login</button>
      </div>

      <div class="card p-2 mb-3">
        <h5>Order Fuel</h5>
        <input id="productID" class="form-control mb-2" placeholder="productID">
        <input id="quantity" class="form-control mb-2" placeholder="quantity">
        <button class="btn btn-success w-100" onclick="createOrder()">Send Order</button>
      </div>

      <div id="status" class="text-muted small"></div>

    </div>

    <div class="col-9 p-0">
      <div id="map"></div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script src="app.js"></script>

</body>
</html>
